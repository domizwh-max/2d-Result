name: Auto Data Capture
on:
  schedule:
    - cron: '31 5,10 * * 1-5'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Run data capture
      run: |
        echo "Starting data capture..."
        echo "Current time (Myanmar): $(date -u -d '+6 hours 30 minutes')"
        echo "Fetching data from SET website..."
        curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://www.set.or.th/en/market/index/set/overview > /dev/null 2>&1 && echo "SET data fetched" || echo "SET data fetch failed"
        echo "Fetching data from mylucky2d3d.com..."
        curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://mylucky2d3d.com/ > /dev/null 2>&1 && echo "Modern Internet data fetched" || echo "Modern Internet data fetch failed"
        echo "Data capture completed."
