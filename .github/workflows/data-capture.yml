name: Auto Data Capture
on:
  schedule:
    # Run every 15 minutes for testing
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  capture-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false
      
      - name: Debug - Show current time and environment
        run: |
          echo "Current UTC time: $(date -u)"
          echo "Current local time: $(date)"
          echo "GitHub event name: ${{ github.event_name }}"
          echo "GitHub ref: ${{ github.ref }}"
          echo "GitHub repository: ${{ github.repository }}"
          echo "Runner OS: ${{ runner.os }}"
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pyrebase4
          
      - name: Validate Firebase credentials
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "WARNING: FIREBASE_SERVICE_ACCOUNT secret is not set"
            echo "Creating a dummy file for testing"
            echo '{"type": "service_account", "dummy": true}' > firebase-service-account.json
          else
            echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > firebase-service-account.json
            echo "Firebase service account key created successfully"
          fi
      
      - name: Create and run data capture script
        run: |
          cat > data_capture.py << 'EOF'
          #!/usr/bin/env python3
          """
          Data capture script for 2D Result Tracker
          """
          
          import requests
          import json
          import datetime
          import os
          import sys
          from bs4 import BeautifulSoup
          
          def get_current_time_myanmar():
              """Get current time in Myanmar timezone"""
              # Myanmar is UTC+6:30
              utc_time = datetime.datetime.utcnow()
              myanmar_time = utc_time + datetime.timedelta(hours=6, minutes=30)
              return myanmar_time
          
          def get_current_date():
              """Get current date in dd/MM/yyyy format (Myanmar time)"""
              myanmar_time = get_current_time_myanmar()
              return myanmar_time.strftime('%d/%m/%Y')
          
          def main():
              """Main function to capture and save data"""
              print("Starting data capture test...")
              
              # Get current time in Myanmar
              myanmar_time = get_current_time_myanmar()
              current_time_str = myanmar_time.strftime('%d/%m/%Y %H:%M:%S')
              print(f"Current time (Myanmar): {current_time_str}")
              
              # Show what time it would be for our scheduled captures
              print("Checking if this would be a scheduled capture time:")
              is_morning = myanmar_time.hour == 12 and myanmar_time.minute == 1
              is_afternoon = myanmar_time.hour == 16 and myanmar_time.minute == 30
              is_modern_internet = myanmar_time.hour == 17 and myanmar_time.minute == 50
              
              print(f"12:01 PM capture time: {is_morning}")
              print(f"4:30 PM capture time: {is_afternoon}")
              print(f"5:50 PM capture time: {is_modern_internet}")
              
              # Test Firebase connection if credentials exist
              try:
                  if os.path.exists("firebase-service-account.json"):
                      with open("firebase-service-account.json", "r") as f:
                          content = f.read()
                          print(f"Firebase service account file exists, size: {len(content)} chars")
                          if "dummy" in content:
                              print("Using dummy Firebase credentials for testing")
                          else:
                              print("Using real Firebase credentials")
                  else:
                      print("No Firebase service account file found")
              except Exception as e:
                  print(f"Error checking Firebase credentials: {e}")
              
              print("Data capture test completed.")
          
          if __name__ == "__main__":
              main()
          EOF
          
          python data_capture.py
