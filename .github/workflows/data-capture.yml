name: Auto Data Capture
on:
  schedule:
    # Run at 12:01 PM and 4:30 PM Myanmar time (UTC+6:30)
    # 12:01 PM Myanmar = 5:31 AM UTC
    # 4:30 PM Myanmar = 10:00 AM UTC
    - cron: '31 5,10 * * 1-5'
  workflow_dispatch: # Allows manual trigger

jobs:
  capture-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2
        
      - name: Build data capture script
        run: |
          cd scripts
          chmod +x gradlew
          ./gradlew build
          
      - name: Run data capture
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          cd scripts
          java -jar build/libs/scripts.jar
          
      - name: Commit and push if there are changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Auto-capture data $(date)" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
