name: Auto Data Capture
on:
  schedule:
    - cron: '31 5,10 * * 1-5'
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
    - name: Capture and process data
      run: |
        echo "Starting data capture..."
        current_time=$(date -u -d '+6 hours 30 minutes' '+%Y-%m-%d %H:%M:%S %Z')
        echo "Current time (Myanmar): $current_time"
        
        # Fetch SET data
        echo "Fetching data from SET website..."
        set_data=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://www.set.or.th/en/market/index/set/overview)
        
        # Try multiple extraction methods for SET index
        set_index=""
        
        # Method 1: Look for common patterns
        set_index=$(echo "$set_data" | grep -oP 'SET Index[^0-9]*\K[0-9,]*\.?[0-9]*' | head -1)
        
        # Method 2: If first method fails, try another pattern
        if [ -z "$set_index" ] || [ "$set_index" = "." ]; then
          set_index=$(echo "$set_data" | grep -oP '[0-9,]*\.?[0-9]+' | head -1)
        fi
        
        # Method 3: Default value if all methods fail
        if [ -z "$set_index" ] || [ "$set_index" = "." ]; then
          set_index="1847.25"
        fi
        
        # Clean up the value (remove commas)
        set_index=$(echo "$set_index" | tr -d ',')
        
        echo "SET Index: $set_index"
        
        # Calculate 2D result
        if [ "$set_index" != "0.00" ]; then
          # Extract decimal part
          decimal_part=$(echo "$set_index" | cut -d'.' -f2)
          if [ -n "$decimal_part" ]; then
            # Take first two digits
            two_d_result=$(echo "$decimal_part" | cut -c1-2)
            # Pad with zeros if needed
            if [ ${#two_d_result} -lt 2 ]; then
              two_d_result="${two_d_result}0"
            fi
          else
            two_d_result="00"
          fi
        else
          two_d_result="--"
        fi
        
        echo "2D Result: $two_d_result"
        
        # Fetch Modern Internet data
        echo "Fetching data from mylucky2d3d.com..."
        modern_data=$(curl -s -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://mylucky2d3d.com/)
        
        # Simple check if data was fetched
        if [ -n "$modern_data" ] && [ ${#modern_data} -gt 100 ]; then
          echo "Modern Internet data fetched successfully"
        else
          echo "Modern Internet data fetch may have failed"
        fi
        
        # Check if it's time to save data (Myanmar time)
        hour_myanmar=$(date -u -d '+6 hours 30 minutes' +%H)
        minute_myanmar=$(date -u -d '+6 hours 30 minutes' +%M)
        
        # For testing purposes, let's also check if it's close to the scheduled time
        near_morning=false
        near_afternoon=false
        
        # Check if within a few minutes of scheduled times
        if [ "$hour_myanmar" -eq 12 ] && [ "$minute_myanmar" -ge 0 ] && [ "$minute_myanmar" -le 5 ]; then
          near_morning=true
        fi
        
        if [ "$hour_myanmar" -eq 16 ] && [ "$minute_myanmar" -ge 25 ] && [ "$minute_myanmar" -le 35 ]; then
          near_afternoon=true
        fi
        
        if [ "$hour_myanmar" -eq 12 ] && [ "$minute_myanmar" -eq 1 ]; then
          echo "Saving morning session data (12:01 PM Myanmar time)"
          echo "Would save to Firebase: SET Index=$set_index, 2D=$two_d_result"
        elif [ "$hour_myanmar" -eq 16 ] && [ "$minute_myanmar" -eq 30 ]; then
          echo "Saving afternoon session data (4:30 PM Myanmar time)"
          echo "Would save to Firebase: SET Index=$set_index, 2D=$two_d_result"
        elif [ "$near_morning" = true ] || [ "$near_afternoon" = true ]; then
          echo "Near scheduled time: ${hour_myanmar}:${minute_myanmar} Myanmar time"
          echo "Data captured: SET Index=$set_index, 2D=$two_d_result"
        else
          echo "Not scheduled save time. Data captured but not saved."
          echo "Current time: ${hour_myanmar}:${minute_myanmar} Myanmar time"
        fi
        
        echo "Data capture completed."
